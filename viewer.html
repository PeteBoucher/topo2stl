<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>topo2stl viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14171c; overflow: hidden;
               font: 12px/1.5 -apple-system, system-ui, sans-serif; color: #cdd3da; }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 12px; padding: 10px 12px;
         background: rgba(20,23,28,.72); border: 1px solid #2b313a; border-radius: 8px;
         backdrop-filter: blur(6px); pointer-events: none; }
  #hud b { color: #fff; font-weight: 600; }
  #hud .dim { color: #8b95a1; }
  #bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; }
  #bar button { pointer-events: auto; background: rgba(20,23,28,.72); color: #cdd3da;
    border: 1px solid #2b313a; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #bar button:hover { background: #232830; color: #fff; }
  #bar button.on { background: #3a6df0; border-color: #3a6df0; color: #fff; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #err { position: fixed; bottom: 12px; left: 12px; color: #ff8c8c; }
  #compass { position: fixed; right: 18px; bottom: 18px; width: 66px; height: 66px;
    border-radius: 50%; background: rgba(20,23,28,.72); border: 1px solid #2b313a;
    backdrop-filter: blur(6px); pointer-events: none; }
  #compass .ring { position: absolute; inset: 7px; border-radius: 50%;
    border: 1px solid #3a4048; }
  #needle { position: absolute; inset: 0; transition: transform .08s linear; }
  #needle .n { position: absolute; left: 50%; top: 5px; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-bottom: 20px solid #e8623c; }
  #needle .s { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 20px solid #566; }
  #needle .lbl { position: absolute; left: 50%; top: -15px; transform: translateX(-50%);
    font-weight: 700; font-size: 11px; color: #e8623c; }
  .corner { position: fixed; pointer-events: none; z-index: 5; }
  .corner .dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px;
    border-radius: 50%; background: #e8623c; box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
  .corner .lab { position: absolute; top: 0; transform: translateY(-50%); white-space: nowrap;
    font: 600 12px/1.3 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #eef2f6; text-shadow: 0 1px 3px #000, 0 0 3px #000; }
  .corner .lab .tag { color: #9db3c9; font-weight: 700; letter-spacing: .07em;
    margin-right: 6px; }
  #area { position: fixed; left: 12px; bottom: 12px; width: 208px; padding: 12px;
    background: rgba(20,23,28,.85); border: 1px solid #2b313a; border-radius: 8px;
    backdrop-filter: blur(6px); }
  #area h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: #8b95a1; font-weight: 700; }
  #area .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: 132px; margin: 0 auto 8px; }
  #area .pad button { padding: 5px 0; }
  #area button { background: #232830; color: #cdd3da; border: 1px solid #333b46;
    border-radius: 5px; cursor: pointer; font: inherit; }
  #area button:hover { background: #2d333d; color: #fff; }
  #area button:disabled { opacity: .4; cursor: default; }
  #area .zoom { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
  #area .zoom button { flex: 1; padding: 4px 0; }
  #area .key { font-size: 10px; color: #6b7480; text-align: center; margin-bottom: 8px; }
  #area .rd { font-size: 11px; color: #9db3c9; line-height: 1.5; margin-bottom: 8px;
    font-variant-numeric: tabular-nums; }
  #area .rd b { color: #eef2f6; }
  #area #bregen { width: 100%; padding: 7px 0; background: #2f6f3f;
    border-color: #2f6f3f; color: #fff; font-weight: 600; }
  #area #bregen:hover { background: #3a8a4d; }
  #area .saveas { display: flex; gap: 6px; margin-top: 8px; }
  #area .saveas input { flex: 1; min-width: 0; background: #1b1f25;
    border: 1px solid #333b46; border-radius: 5px; color: #cdd3da;
    font: inherit; padding: 6px 8px; }
  #area .saveas input::placeholder { color: #5b6472; }
  #area .saveas button { white-space: nowrap; padding: 0 10px; }
  #area #areahint { color: #d9a441; font-size: 10.5px; margin-top: 6px; }
  #regen { position: fixed; inset: 0; background: rgba(10,12,15,.82);
    display: none; flex-direction: column; align-items: center;
    justify-content: center; z-index: 50; }
  #regen .box { width: min(640px, 86vw); background: #14171c;
    border: 1px solid #2b313a; border-radius: 10px; padding: 16px; }
  #regen .box h3 { margin: 0 0 10px; font-size: 13px; }
  #regen pre { margin: 0; max-height: 46vh; overflow: auto; white-space: pre-wrap;
    font: 11px/1.45 ui-monospace, Menlo, monospace; color: #b7c0cb;
    background: #0d0f12; border: 1px solid #23282f; border-radius: 6px; padding: 10px; }
  #regen .row { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
  #regen .row button { background: #232830; color: #cdd3da; border: 1px solid #333b46;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b id="fname">-</b></div>
  <div class="dim"><span id="tris">-</span> triangles</div>
  <div>X <b id="sx">-</b> &nbsp; Y <b id="sy">-</b> &nbsp; Z <b id="sz">-</b> mm</div>
  <div class="dim" id="relief"></div>
  <div class="dim" id="stamp"></div>
</div>
<div id="bar">
  <button id="bfit">Fit</button>
  <button id="brelief">Relief: lines</button>
  <button id="bwire">Wireframe</button>
  <button id="bspin">Spin</button>
  <button id="bcoords">Coords</button>
  <button id="bseams">Seams</button>
  <button id="barea">Area</button>
</div>
<div id="err"></div>
<div id="area" hidden>
  <h4>Bounding box</h4>
  <div class="pad">
    <span></span><button data-pan="n">▲</button><span></span>
    <button data-pan="w">◀</button><button id="areset" title="reset to current">⟳</button><button data-pan="e">▶</button>
    <span></span><button data-pan="s">▼</button><span></span>
  </div>
  <div class="zoom"><button data-zoom="in">− zoom in</button><button data-zoom="out">+ zoom out</button></div>
  <div class="key" id="areahintk"></div>
  <div class="rd" id="aread"></div>
  <button id="bregen">Regenerate STL</button>
  <div class="saveas">
    <input id="saveasname" type="text" placeholder="save as new file…">
    <button id="bsaveas">Save as</button>
  </div>
  <div id="areahint"></div>
</div>
<div id="regen">
  <div class="box">
    <h3 id="regenttl">Regenerating…</h3>
    <pre id="regenlog"></pre>
    <div class="row"><button id="regenclose" hidden>Close</button></div>
  </div>
</div>
<div id="compass">
  <div class="ring"></div>
  <div id="needle"><span class="lbl">N</span><span class="n"></span><span class="s"></span></div>
</div>
<div class="corner" id="cSW"><span class="dot"></span><span class="lab"><span class="tag">SW</span><span class="txt"></span></span></div>
<div class="corner" id="cNE"><span class="dot"></span><span class="lab"><span class="tag">NE</span><span class="txt"></span></span></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171c);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
camera.up.set(0, 0, 1);                       // topo2stl STLs are Z-up

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.2;   // orbits the camera around controls.target

scene.add(new THREE.HemisphereLight(0xffffff, 0x33383f, 2.2));
const key = new THREE.DirectionalLight(0xfff0e0, 2.4);
key.position.set(0.6, -1, 1.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.8);
rim.position.set(-1, 0.4, 0.5);
scene.add(rim);

const material = new THREE.MeshStandardMaterial({
  color: 0xc98f5a, roughness: 0.82, metalness: 0.02, flatShading: false,
  side: THREE.DoubleSide });   // stay solid even if an STL is wound inside-out

// Inject a hypsometric tint + contour lines keyed off world Z, toggled by uniforms.
material.onBeforeCompile = (shader) => {
  shader.uniforms.uZMin = { value: 0 };
  shader.uniforms.uZMax = { value: 1 };
  shader.uniforms.uStep = { value: 0 };      // contour spacing in model mm
  shader.uniforms.uTint = { value: 1 };
  shader.uniforms.uContour = { value: 1 };
  shader.vertexShader = 'varying vec3 vWPos;\n' + shader.vertexShader.replace(
    '#include <begin_vertex>',
    '#include <begin_vertex>\n  vWPos = (modelMatrix * vec4(position, 1.0)).xyz;');
  shader.fragmentShader =
    'varying vec3 vWPos;\nuniform float uZMin,uZMax,uStep,uTint,uContour;\n' +
    shader.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    {
      float t = clamp((vWPos.z - uZMin) / max(uZMax - uZMin, 1e-4), 0.0, 1.0);
      if (uTint > 0.5) {
        vec3 g0=vec3(0.20,0.44,0.28), g1=vec3(0.55,0.72,0.36), g2=vec3(0.86,0.78,0.52),
             g3=vec3(0.62,0.42,0.26), g4=vec3(0.97,0.96,0.93);
        vec3 hc = t<0.25 ? mix(g0,g1,t/0.25)
                : t<0.50 ? mix(g1,g2,(t-0.25)/0.25)
                : t<0.75 ? mix(g2,g3,(t-0.50)/0.25)
                :          mix(g3,g4,(t-0.75)/0.25);
        diffuseColor.rgb = mix(diffuseColor.rgb, hc, 0.9);
      }
      if (uContour > 0.5 && uStep > 0.0) {
        float band = (vWPos.z - uZMin) / uStep;
        float fp = fract(band); float dist = min(fp, 1.0 - fp);
        float line = 1.0 - smoothstep(0.0, max(fwidth(band), 1e-5) * 1.2, dist);
        float mb = band / 5.0; float mfp = fract(mb); float mdist = min(mfp, 1.0 - mfp);
        float major = 1.0 - smoothstep(0.0, max(fwidth(mb), 1e-5) * 1.2, mdist);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.09,0.08,0.06),
                               line * 0.30 + major * 0.35);
      }
    }`);
  material.userData.shader = shader;
};

let mesh = null;
let grid = null;
let reliefMode = 2;                 // 0 off, 1 tint, 2 tint + contour lines
const RELIEF_LABELS = ['Relief: off', 'Relief: tint', 'Relief: lines'];

function niceInterval(reliefM) {
  const steps = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000];
  for (const s of steps) if (reliefM / s <= 16) return s;
  return 5000;
}
function applyReliefUniforms() {
  const sh = material.userData.shader;
  if (sh) {
    sh.uniforms.uTint.value = reliefMode >= 1 ? 1 : 0;
    sh.uniforms.uContour.value = reliefMode >= 2 ? 1 : 0;
  }
  const b = document.getElementById('brelief');
  if (b) { b.textContent = RELIEF_LABELS[reliefMode];
           b.classList.toggle('on', reliefMode > 0); }
}

// Recompute the tint range + contour spacing from the current model + meta.
function updateReliefRange() {
  const sh = material.userData.shader;
  if (!sh || !mesh) return;
  const bb = mesh.geometry.boundingBox;
  const baseMm = (meta && +meta.base_mm) || 0;
  const zLo = bb.min.z + baseMm, zHi = bb.max.z;
  sh.uniforms.uZMin.value = zLo;
  sh.uniforms.uZMax.value = zHi;

  const reliefMm = Math.max(zHi - zLo, 0.001);
  const mPerMm = meta && +meta.elev_m_per_mm ? +meta.elev_m_per_mm : null;
  let stepMm, label;
  if (mPerMm) {
    const intM = niceInterval(reliefMm * mPerMm);
    stepMm = intM / mPerMm;
    label = `contours every ${intM} m (bold every ${intM * 5} m)`;
  } else {
    stepMm = reliefMm / 12;
    label = `contours every ~${stepMm.toFixed(1)} mm`;
  }
  sh.uniforms.uStep.value = stepMm;
  document.getElementById('relief').textContent = reliefMode >= 2 ? label : '';
}

const loader = new STLLoader();
const $ = id => document.getElementById(id);

function frame(geometry) {
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const size = new THREE.Vector3(); bb.getSize(size);
  const c = new THREE.Vector3(); bb.getCenter(c);
  const r = size.length() / 2;
  const dir = new THREE.Vector3(1, -1.15, 0.85).normalize();
  camera.position.copy(c).addScaledVector(dir, r * 2.6);
  controls.target.copy(c);
  camera.near = r / 100; camera.far = r * 50;
  camera.updateProjectionMatrix();
  controls.update();
}

function setModel(rawGeometry, refit) {
  // STL is a triangle soup -> weld shared vertices so normals can be smooth
  // (otherwise every facet is flat-shaded and the surface looks corrugated).
  let geometry;
  try { geometry = mergeVertices(rawGeometry, 1e-3); rawGeometry.dispose(); }
  catch (_) { geometry = rawGeometry; }
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const size = new THREE.Vector3(); geometry.boundingBox.getSize(size);

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  if (grid) scene.remove(grid);
  const g = Math.max(size.x, size.y) * 1.4;
  grid = new THREE.GridHelper(g, 20, 0x3a4048, 0x262b31);
  grid.rotation.x = Math.PI / 2;               // into the XY plane (Z-up world)
  const cen = new THREE.Vector3(); geometry.boundingBox.getCenter(cen);
  grid.position.set(cen.x, cen.y, geometry.boundingBox.min.z);
  scene.add(grid);

  const bb = geometry.boundingBox;                 // SW/NE base corners for labels
  swWorld = new THREE.Vector3(bb.min.x, bb.min.y, bb.min.z);
  neWorld = new THREE.Vector3(bb.max.x, bb.max.y, bb.min.z);

  const nTri = geometry.index ? geometry.index.count / 3
                              : geometry.attributes.position.count / 3;
  $('tris').textContent = nTri.toLocaleString();
  $('sx').textContent = size.x.toFixed(1);
  $('sy').textContent = size.y.toFixed(1);
  $('sz').textContent = size.z.toFixed(1);
  $('stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
  updateReliefRange();
  if (typeof refreshArea === 'function') refreshArea();
  if (refit) frame(geometry);
}

let currentVersion = null;
let currentName = null;
let firstLoad = true;

async function poll() {
  let v;
  try {
    v = await (await fetch('/version', { cache: 'no-store' })).text();
  } catch (e) {
    $('err').textContent = 'viewer server not responding';
    setTimeout(poll, 1000);
    return;
  }
  const name = v.split('|').slice(1).join('|');
  window.__fname = name;
  $('fname').textContent = name || '-';
  const missing = v.startsWith('0|');
  if (v !== currentVersion && !missing) {
    // a separate try: the server responded fine, so a failure here means the
    // file isn't parseable STL (e.g. pointed at the wrong kind of file) -
    // worth a different message than "not responding".
    try {
      const buf = await (await fetch('/model.stl', { cache: 'no-store' })).arrayBuffer();
      const geo = loader.parse(buf);
      setModel(geo, firstLoad || name !== currentName);
      try { applyMeta(await (await fetch('/meta', { cache: 'no-store' })).json()); }
      catch (_) { applyMeta(null); }
      currentVersion = v;
      currentName = name;
      firstLoad = false;
      $('err').textContent = '';
    } catch (e) {
      $('err').textContent = `couldn't read ${name || 'the model'} as STL (${e.message || e})`;
    }
  } else if (missing) {
    $('err').textContent = 'waiting for ' + (name || 'file') + ' ...';
  }
  setTimeout(poll, 1000);
}

$('bfit').onclick = () => { if (mesh) frame(mesh.geometry); };
$('brelief').onclick = () => {
  reliefMode = (reliefMode + 1) % 3;
  applyReliefUniforms();
  updateReliefRange();
};
$('bwire').onclick = e => { material.wireframe = !material.wireframe;
  e.target.classList.toggle('on', material.wireframe); };
$('bspin').onclick = e => { controls.autoRotate = !controls.autoRotate;
  e.target.classList.toggle('on', controls.autoRotate); };

let cw = 1, ch = 1;
function resize() {
  cw = canvas.clientWidth; ch = canvas.clientHeight;
  renderer.setSize(cw, ch, false);
  camera.aspect = cw / ch; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// --- corner coordinate labels -------------------------------------------------
let meta = null;
let showCoords = true;
let swWorld = null, neWorld = null;
const elSW = $('cSW'), elNE = $('cNE');

const fmtDeg = (lat, lon) =>
  `${Math.abs(lat).toFixed(4)}°${lat >= 0 ? 'N' : 'S'}  ` +
  `${Math.abs(lon).toFixed(4)}°${lon >= 0 ? 'E' : 'W'}`;

function applyMeta(m) {
  meta = (m && Array.isArray(m.bbox) && m.bbox.length === 4) ? m : null;
  const btn = $('bcoords');
  if (!meta) {
    btn.disabled = true; btn.classList.remove('on');
    elSW.style.display = elNE.style.display = 'none';
    $('barea').disabled = true;
    pend = null;
  } else {
    btn.disabled = false;
    btn.classList.toggle('on', showCoords);
    elSW.querySelector('.txt').textContent = fmtDeg(meta.bbox[0], meta.bbox[1]);
    elNE.querySelector('.txt').textContent = fmtDeg(meta.bbox[2], meta.bbox[3]);
    $('barea').disabled = false;
    pend = meta.bbox.slice();
  }
  rebuildSeams(m);
  const tiled = !!(meta && meta.tile_grid);
  $('bregen').textContent = tiled ? `Regenerate ${meta.tile_grid[0]}x${meta.tile_grid[1]} tileset` : 'Regenerate STL';
  $('saveasname').placeholder = tiled ? 'save as new tileset base name…' : 'save as new file…';
  updateReliefRange();
  if (typeof refreshArea === 'function') refreshArea();
}

// --- tileset seam lines (from tileset_preview.py's sidecar) ------------------
let showSeams = true;
let seamLines = [];
const seamMat = new THREE.LineBasicMaterial({ color: 0xff3b30 });

function rebuildSeams(m) {
  for (const line of seamLines) { scene.remove(line); line.geometry.dispose(); }
  seamLines = [];
  const segs = [...(m?.seams?.vertical || []), ...(m?.seams?.horizontal || [])];
  for (const pts of segs) {
    const g = new THREE.BufferGeometry().setFromPoints(
      pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
    const line = new THREE.Line(g, seamMat);
    line.visible = showSeams;
    scene.add(line);
    seamLines.push(line);
  }
  const btn = $('bseams');
  btn.disabled = segs.length === 0;
  btn.classList.toggle('on', showSeams && segs.length > 0);
}

$('bseams').onclick = e => {
  showSeams = !showSeams;
  for (const line of seamLines) line.visible = showSeams;
  e.target.classList.toggle('on', showSeams);
};

function placeCorner(el, world) {
  if (!showCoords || !meta || !world) { el.style.display = 'none'; return; }
  const v = world.clone().project(camera);
  if (v.z > 1) { el.style.display = 'none'; return; }     // behind the camera
  const sx = (v.x * 0.5 + 0.5) * cw;
  const sy = (-v.y * 0.5 + 0.5) * ch;
  el.style.display = '';
  el.style.left = sx + 'px';
  el.style.top = Math.max(14, Math.min(ch - 14, sy)) + 'px';
  const lab = el.querySelector('.lab');
  const onLeft = sx < cw / 2;               // point on the left half -> hang label further left
  lab.style.left = onLeft ? 'auto' : '14px';
  lab.style.right = onLeft ? '14px' : 'auto';
  lab.style.textAlign = onLeft ? 'right' : 'left';
}
function placeCorners() { placeCorner(elSW, swWorld); placeCorner(elNE, neWorld); }

$('bcoords').onclick = e => {
  showCoords = !showCoords;
  e.target.classList.toggle('on', showCoords && !!meta);
};

// --- bounding-box pan / zoom + regenerate -----------------------------------
let pend = null;                 // [minLat, minLon, maxLat, maxLon] pending
let areaOpen = false;
const rectMat = new THREE.LineBasicMaterial({ color: 0x53a7ff });
let rect = new THREE.LineLoop(new THREE.BufferGeometry(), rectMat);
rect.visible = false;
scene.add(rect);

const kmSpan = b => {
  const mLat = (b[2] - b[0]) * 111320;
  const mLon = (b[3] - b[1]) * 111320 * Math.cos((b[0] + b[2]) / 2 * Math.PI / 180);
  return [mLon / 1000, mLat / 1000];          // [E-W, N-S]
};
const fmtLL = (lat, lon) =>
  `${Math.abs(lat).toFixed(4)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(4)}°${lon >= 0 ? 'E' : 'W'}`;

function refreshArea() {
  if (!pend || !meta) return;
  const [kw, kh] = kmSpan(pend);
  const changed = meta.bbox.some((v, i) => Math.abs(v - pend[i]) > 1e-9);
  $('aread').innerHTML =
    `SW ${fmtLL(pend[0], pend[1])}<br>NE ${fmtLL(pend[2], pend[3])}<br>` +
    `<b>${kw.toFixed(1)} × ${kh.toFixed(1)} km</b>${changed ? '' : '  (current)'}`;
  // pending rect in model space, using the current bbox as the reference frame
  if (mesh) {
    const bb = mesh.geometry.boundingBox;
    const W = bb.max.x - bb.min.x, H = bb.max.y - bb.min.y;
    const [c0, c1, c2, c3] = meta.bbox;
    const fx = lon => bb.min.x + (lon - c1) / (c3 - c1) * W;
    const fy = lat => bb.min.y + (lat - c0) / (c2 - c0) * H;
    const z = bb.max.z + Math.max(W, H) * 0.03;
    const p = new Float32Array([
      fx(pend[1]), fy(pend[0]), z, fx(pend[3]), fy(pend[0]), z,
      fx(pend[3]), fy(pend[2]), z, fx(pend[1]), fy(pend[2]), z]);
    rect.geometry.setAttribute('position', new THREE.BufferAttribute(p, 3));
    rect.geometry.computeBoundingSphere();
    rect.visible = areaOpen;
  }
}

function panPend(dLat, dLon) {
  const sLat = pend[2] - pend[0], sLon = pend[3] - pend[1];
  pend = [pend[0] + dLat * sLat, pend[1] + dLon * sLon,
          pend[2] + dLat * sLat, pend[3] + dLon * sLon];
  refreshArea();
}
function zoomPend(k) {
  const cLa = (pend[0] + pend[2]) / 2, cLo = (pend[1] + pend[3]) / 2;
  const hLa = (pend[2] - pend[0]) / 2 * k, hLo = (pend[3] - pend[1]) / 2 * k;
  pend = [cLa - hLa, cLo - hLo, cLa + hLa, cLo + hLo];
  refreshArea();
}

document.querySelectorAll('#area .pad button[data-pan]').forEach(b =>
  b.onclick = ev => {
    const d = ev.shiftKey ? 0.02 : (ev.altKey ? 0.20 : 0.07);   // fine / coarse / normal
    ({ n: () => panPend(d, 0), s: () => panPend(-d, 0),
       e: () => panPend(0, d), w: () => panPend(0, -d) }[b.dataset.pan])();
  });
document.querySelectorAll('#area .zoom button[data-zoom]').forEach(b =>
  b.onclick = ev => {
    const step = ev.shiftKey ? 0.03 : (ev.altKey ? 0.25 : 0.11);
    zoomPend(b.dataset.zoom === 'in' ? 1 - step : 1 / (1 - step));
  });
$('areahintk').textContent = 'Shift = fine · Alt = coarse';
$('areset').onclick = () => { if (meta) { pend = meta.bbox.slice(); refreshArea(); } };

$('barea').onclick = e => {
  areaOpen = !areaOpen;
  $('area').hidden = !areaOpen;
  e.target.classList.toggle('on', areaOpen);
  rect.visible = areaOpen && !!pend;
  if (areaOpen) checkRegenAvail();
};

async function checkRegenAvail() {
  try {
    const r = await (await fetch('/regen/available')).json();
    $('bregen').disabled = !r.ok;
    $('bsaveas').disabled = !r.ok;
    $('areahint').textContent = r.ok ? '' : r.reason;
  } catch (_) { $('bregen').disabled = true; $('bsaveas').disabled = true; }
}

const tiledNow = () => !!(meta && meta.tile_grid);

$('bregen').onclick = () => startRegen(tiledNow() ? 'Regenerating tileset…' : 'Regenerating…');

$('bsaveas').onclick = async () => {
  let name = $('saveasname').value.trim();
  if (!name) { $('saveasname').focus(); return; }
  if (!/\.stl$/i.test(name)) name += '.stl';
  try {
    const ex = await (await fetch('/exists?name=' + encodeURIComponent(name))).json();
    const what = tiledNow() ? `a ${name.replace(/\.stl$/i, '')} tileset` : name;
    if (ex.exists && !confirm(`${what} already exists - overwrite it?`)) return;
  } catch (_) { /* can't check - proceed, the server still confirms bbox validity */ }
  startRegen(tiledNow() ? `Saving as ${name} tileset…` : `Saving as ${name}…`, name);
};

async function startRegen(title, filename) {
  if (!pend) return;
  $('regen').style.display = 'flex';
  $('regenttl').textContent = title;
  $('regenlog').textContent = 'starting…';
  $('regenclose').hidden = true;
  try {
    const body = { bbox: pend };
    if (filename) body.filename = filename;
    const j = await (await fetch('/regen', {
      method: 'POST', body: JSON.stringify(body) })).json();
    if (j.error) { regenFail(j.error); return; }
  } catch (e) { regenFail(String(e)); return; }
  pollRegen();
}
function regenFail(msg) {
  $('regenttl').textContent = 'Regenerate failed';
  $('regenlog').textContent += '\n\n' + msg;
  $('regenclose').hidden = false;
}
async function pollRegen() {
  let s;
  try { s = await (await fetch('/regen/status', { cache: 'no-store' })).json(); }
  catch (_) { setTimeout(pollRegen, 900); return; }
  const pre = $('regenlog');
  pre.textContent = s.log || '…';
  pre.scrollTop = pre.scrollHeight;
  if (s.running) { setTimeout(pollRegen, 700); return; }
  if (s.error) { regenFail(s.error); return; }
  $('regen').style.display = 'none';
  if (s.saved_as) $('saveasname').value = '';  // saved ok - clear for the next name
  currentVersion = null;                       // force the poll loop to reload
}
$('regenclose').onclick = () => { $('regen').style.display = 'none'; };

const NORTH = new THREE.Vector3(0, 1, 0);   // +Y is north in topo2stl STLs
const invQ = new THREE.Quaternion();
const needle = document.getElementById('needle');
function updateCompass() {
  // north direction expressed in camera/view space, projected onto the screen
  const v = NORTH.clone().applyQuaternion(invQ.copy(camera.quaternion).invert());
  const deg = Math.atan2(v.x, v.y) * 180 / Math.PI;   // 0 = north points up
  needle.style.transform = `rotate(${deg}deg)`;
}

let shaderReady = false;
function tick() {
  requestAnimationFrame(tick);
  controls.update();            // applies damping + autoRotate about the target
  if (!shaderReady && material.userData.shader) {   // shader compiles on 1st render
    shaderReady = true;
    applyReliefUniforms();
    updateReliefRange();
  }
  updateCompass();
  placeCorners();
  renderer.render(scene, camera);
}
applyReliefUniforms(); resize(); tick(); poll();
</script>
</body>
